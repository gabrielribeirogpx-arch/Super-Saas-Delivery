name: APK Gestão homologação build 32
on:
  push:
    branches: [artifacts/gestao-homologacao-32]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo 'cbd61ff0087ea91b9558c04f32f0b51a6c0fb43d728cc31b48ffae06065203bf  artifacts/fomizero-gestao-homologacao-1.0.0-32-arm64.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-homologacao-1.0.0-32-arm64
          path: artifacts/fomizero-gestao-homologacao-1.0.0-32-arm64.apk
          if-no-files-found: error
          retention-days: 7
