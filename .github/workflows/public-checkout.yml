name: Public checkout regression
on:
  pull_request:
    paths:
      - 'super_saas_frontend/components/CheckoutModal/**'
      - 'super_saas_frontend/components/PublicMenu/**'
      - 'super_saas_frontend/components/storefront/OrderSummary*'
      - 'super_saas_frontend/tests/smoke/premiumCheckout.browser.cjs'
      - '.github/workflows/public-checkout.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-checkout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: super_saas_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: super_saas_frontend/package-lock.json
      - run: npm ci
      - name: Validate checkout with local fixtures
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3053
          CHROMIUM_PATH: /usr/bin/google-chrome
          PREMIUM_CHECKOUT_TEST_BASE_URL: http://127.0.0.1:3053
          PREMIUM_CHECKOUT_ARTIFACT_DIR: ${{ runner.temp }}/public-checkout
          CHECKOUT_POLICY_TEST_BASE_URL: http://127.0.0.1:3053
          ORDER_ATTEMPT_TEST_BASE_URL: http://127.0.0.1:3053
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3053 > "$RUNNER_TEMP/checkout-next.log" 2>&1 &
          checkout_next_pid=$!
          trap 'kill "$checkout_next_pid" 2>/dev/null || true' EXIT
          checkout_ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3053/login > /dev/null; then
              checkout_ready=true
              break
            fi
            sleep 1
          done
          if [ "$checkout_ready" != true ]; then
            tail -n 60 "$RUNNER_TEMP/checkout-next.log"
            exit 1
          fi
          node tests/smoke/premiumCheckout.browser.cjs
          node tests/smoke/checkoutPolicy.browser.cjs
          node tests/smoke/orderAttempt.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-checkout-preview
          path: |
            ${{ runner.temp }}/public-checkout
            ${{ runner.temp }}/checkout-next.log
          if-no-files-found: ignore
          retention-days: 7
