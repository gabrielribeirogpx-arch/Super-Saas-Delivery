name: APK Gestão homologação build 28
on:
  push:
    branches: [artifacts/gestao-homologacao-28]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo '0a7a2e45a4bf167f18e8681afc416a1e8c5b912e824c0f47440779095f4a4eca  artifacts/fomizero-gestao-homologacao-1.0.0-28-arm64.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-homologacao-1.0.0-28-arm64
          path: artifacts/fomizero-gestao-homologacao-1.0.0-28-arm64.apk
          if-no-files-found: error
          retention-days: 7
