name: Driver experience regression
on:
  pull_request:
    paths:
      - 'super_saas_frontend/app/driver/**'
      - 'super_saas_frontend/components/driver/**'
      - 'super_saas_frontend/tests/smoke/driverExperience.browser.cjs'
      - '.github/workflows/driver-experience.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: driver-experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  driver-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: super_saas_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: super_saas_frontend/package-lock.json
      - run: npm ci
      - name: Validate driver journey with local fixtures
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3055
          CHROMIUM_PATH: /usr/bin/google-chrome
          DRIVER_EXPERIENCE_TEST_BASE_URL: http://127.0.0.1:3055
          DRIVER_EXPERIENCE_ARTIFACT_DIR: ${{ runner.temp }}/driver-experience
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3055 > "$RUNNER_TEMP/driver-next.log" 2>&1 &
          driver_next_pid=$!
          trap 'kill "$driver_next_pid" 2>/dev/null || true' EXIT
          driver_ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3055/driver/login > /dev/null; then
              driver_ready=true
              break
            fi
            sleep 1
          done
          if [ "$driver_ready" != true ]; then
            tail -n 60 "$RUNNER_TEMP/driver-next.log"
            exit 1
          fi
          node tests/smoke/driverExperience.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-experience-preview
          path: |
            ${{ runner.temp }}/driver-experience
            ${{ runner.temp }}/driver-next.log
          if-no-files-found: ignore
          retention-days: 7
