name: Publicar Fomizero Entregador 1.0.6
on:
  push:
    branches: [artifacts/entregador-1.0.6]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -p artifacts/entregador-1.0.6.zip app-release.apk > fomizero-entregador-v1.0.6.apk
          echo '318f163b70b181059b0fc4aa882e7729efead22575b52af60b99f785c00f3cd6  fomizero-entregador-v1.0.6.apk' | sha256sum -c -
          gh release create entregador-v1.0.6 fomizero-entregador-v1.0.6.apk \
            --target "$GITHUB_SHA" --latest=false --title 'Fomizero Entregador 1.0.6' \
            --notes 'APK Android assinado com Mapbox Navigation SDK.'
