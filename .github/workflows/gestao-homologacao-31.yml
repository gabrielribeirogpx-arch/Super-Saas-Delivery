name: APK Gestão homologação build 31
on:
  push:
    branches: [artifacts/gestao-homologacao-31]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo 'de744c1bd1be367b4480fb25189e77bf954e5dcaaca2ee74f94b48a552c02ac4  artifacts/fomizero-gestao-homologacao-1.0.0-31-arm64.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-homologacao-1.0.0-31-arm64
          path: artifacts/fomizero-gestao-homologacao-1.0.0-31-arm64.apk
          if-no-files-found: error
          retention-days: 7
