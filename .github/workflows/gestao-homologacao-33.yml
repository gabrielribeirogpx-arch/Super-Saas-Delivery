name: APK Gestão homologação build 33
on:
  push:
    branches: [artifacts/gestao-homologacao-33]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo '6e7770243a2fc800e6ab28f65829219bcb30e3778975c8ba884a0c2c3849ea3e  artifacts/fomizero-gestao-homologacao-1.0.0-33-arm64.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-homologacao-1.0.0-33-arm64
          path: artifacts/fomizero-gestao-homologacao-1.0.0-33-arm64.apk
          if-no-files-found: error
          retention-days: 7
