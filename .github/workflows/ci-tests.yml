name: CI - Backend e Frontend Smoke

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd 'Super_SaaS_ Burger_backend'
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate OpenAPI critical contracts
        run: |
          cd 'Super_SaaS_ Burger_backend'
          python scripts/check_openapi_contracts.py

      - name: Validate Alembic single head
        run: |
          cd 'Super_SaaS_ Burger_backend'
          python scripts/check_alembic_single_head.py

      - name: Run backend pytest suite
        run: |
          cd 'Super_SaaS_ Burger_backend'
          export PYTHONPATH=.
          pytest -q

  frontend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: super_saas_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: super_saas_frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate order summary persistence
        run: npm run test:order-summary

      - name: Validate customer authentication isolation
        run: npm run test:customer-auth

      - name: Validate checkout policy client guards
        run: npm run test:checkout-policy

      - name: Validate server order history query parameters
        run: npm run test:order-history

      - name: Validate checkout attempt recovery and deduplication
        run: npm run test:order-attempt

      - name: Validate mobile performance period aggregation
        run: npm run test:mobile-performance

      - name: Run frontend smoke tests
        run: npm run test:smoke

  native-payments-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: native_payments_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-ci-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d native_payments_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: 'Super_SaaS_ Burger_backend'
        run: pip install -r requirements.txt
      - name: Native payment migrations and concurrency on PostgreSQL
        working-directory: 'Super_SaaS_ Burger_backend'
        env:
          NATIVE_PAYMENTS_TEST_DATABASE_URL: postgresql+psycopg://postgres:native-ci-disposable@localhost:5432/native_payments_ci
          FOMIZERO_PHASE4_DATABASE_URL: postgresql+psycopg://postgres:native-ci-disposable@localhost:5432/native_payments_ci
          FOMIZERO_PHASE4_CONFIRM_STAGING: "yes"
        run: pytest -q tests/test_native_payment_postgresql.py tests/test_manual_payments_postgresql.py tests/staging
