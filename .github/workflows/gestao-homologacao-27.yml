name: APK Gestão homologação build 27
on:
  push:
    branches: [artifacts/gestao-homologacao-27]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo 'a344b3ab90970a5d7539260253e4e30934ab45e8c368b4425b12e381621e17d9  artifacts/fomizero-gestao-homologacao-1.0.0-27-arm64.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-homologacao-1.0.0-27-arm64
          path: artifacts/fomizero-gestao-homologacao-1.0.0-27-arm64.apk
          if-no-files-found: error
          retention-days: 7
