name: APK Gestão homologação build 24
on:
  push:
    branches: [artifacts/gestao-homologacao-24]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo '86d986033361eda7e0e7b992952627ac5b3248fc49c0aa7be81b34d99d8db60e  artifacts/fomizero-gestao-homologacao-1.0.0-24-arm64.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-homologacao-1.0.0-24-arm64
          path: artifacts/fomizero-gestao-homologacao-1.0.0-24-arm64.apk
          if-no-files-found: error
          retention-days: 7
