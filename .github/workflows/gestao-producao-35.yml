name: APK Gestão produção build 35
on:
  push:
    branches: [artifacts/gestao-producao-35]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo 'b05ef804d87cf9a544465f396fc67ba37763684b9f1bf06dd10f1b1902cf59e6  artifacts/fomizero-gestao-producao-1.0.0-35-arm64.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-producao-1.0.0-35-arm64
          path: artifacts/fomizero-gestao-producao-1.0.0-35-arm64.apk
          if-no-files-found: error
          retention-days: 7
