name: Fomizero Gestão Android

on:
  pull_request:
    paths:
      - 'android-gestao/**'
      - '.github/workflows/android-gestao.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-gestao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter config --jdk-dir="$JAVA_HOME"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-flutter-debug
          path: android-gestao/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
