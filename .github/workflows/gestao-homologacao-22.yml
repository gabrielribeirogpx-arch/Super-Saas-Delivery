name: APK Gestão homologação build 22
on:
  push:
    branches: [artifacts/gestao-homologacao-22]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: echo '9e1750eb7d06efab1ada4c25ac62cd6c39a35b693d4110137bc54e080bf9bd2e  artifacts/fomizero-gestao-homologacao-1.0.0-22-arm64.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: fomizero-gestao-homologacao-1.0.0-22-arm64
          path: artifacts/fomizero-gestao-homologacao-1.0.0-22-arm64.apk
          if-no-files-found: error
          retention-days: 7
